name: CI

# Manual only (D-03): it runs for a release, never on push, tag, or pull request.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated build targets (macos-arm64, linux-x64, linux-arm64)
        type: string
        default: macos-arm64,linux-x64,linux-arm64
      suite:
        description: Which jobs to run
        type: choice
        options:
          - gate
          - engine
          - package
          - package-smoke
          - e2e
          - updater
          - full
        default: gate

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GGML_NATIVE: "OFF"

jobs:
  gate:
    if: inputs.suite == 'gate' || inputs.suite == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The tests link hushpen-app, which links the GPUI libraries like the build job does.
      - name: Install the GPUI build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libxi-dev libxrandr-dev libasound2-dev libvulkan-dev libdbus-1-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Gate
        run: cargo xtask gate

  plan:
    if: inputs.suite != 'gate' && inputs.suite != 'e2e' && inputs.suite != 'updater'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          all='[
            {"target":"macos-arm64","os":"macos-15"},
            {"target":"linux-x64","os":"ubuntu-22.04"},
            {"target":"linux-arm64","os":"ubuntu-22.04-arm"}
          ]'
          picked=$(jq -c --arg wanted ",${TARGETS// /}," \
            '[.[] | select(.target as $t | $wanted | contains("," + $t + ","))]' <<<"$all")
          if [ "$picked" = "[]" ]; then
            echo "::error::targets '$TARGETS' matches none of macos-arm64, linux-x64, linux-arm64"
            exit 1
          fi
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"

  build:
    # The package jobs build the release binaries themselves.
    if: inputs.suite != 'package' && inputs.suite != 'package-smoke' && inputs.suite != 'updater'
    needs: plan
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the GPUI build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libxi-dev libxrandr-dev libasound2-dev libvulkan-dev libdbus-1-dev
      - name: Release build
        run: cargo build --release --locked -p hushpen-app -p hushpen-llm -p hushpen-tts
      - name: Run the three programs
        run: |
          ./target/release/hushpen --version
          ./target/release/hushpen-llm --version
          ./target/release/hushpen-tts --version
      - name: Show the whisper.cpp build settings
        if: inputs.suite == 'engine' || inputs.suite == 'full'
        run: |
          cache=$(find target/release/build -path '*whisper-rs-sys-*' -name CMakeCache.txt | head -n 1)
          echo "CMakeCache: $cache"
          grep -E '^(GGML_NATIVE|GGML_AVX2|GGML_FMA|GGML_F16C|GGML_METAL|WHISPER_BUILD_IS_DEV):' "$cache"
          grep -q '^GGML_NATIVE:BOOL=OFF$' "$cache"
          if grep -E -- '-mcpu=native|-march=native' "$(dirname "$cache")/compile_commands.json"; then
            echo "::error::native CPU flags in the ggml build"
            exit 1
          fi
          grep -h 'whisper.cpp version' target/release/build/whisper-rs-sys-*/output
      - name: Cache the engine test model
        if: inputs.suite == 'engine' || inputs.suite == 'full'
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/ggml-tiny.en.bin
          key: ggml-tiny.en-921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
      - name: Download the engine test model
        if: (inputs.suite == 'engine' || inputs.suite == 'full') && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL --retry 3 -o models/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
      - name: Engine smoke (CPU, 2 threads)
        if: inputs.suite == 'engine' || inputs.suite == 'full'
        env:
          HUSHPEN_TEST_MODEL: ${{ github.workspace }}/models/ggml-tiny.en.bin
        run: |
          echo "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  models/ggml-tiny.en.bin" | shasum -a 256 -c -
          # The import tests read the AIFF, ALAC, and long-clip fixtures and ggml-base.en from the
          # owner's test-assets folders, which a runner does not have.
          cargo test --release -p hushpen-engine --features heavy --test it --locked -- --test-threads=1 --nocapture --skip import::
      - name: Engine smoke (Metal, best effort)
        if: (inputs.suite == 'engine' || inputs.suite == 'full') && matrix.target == 'macos-arm64'
        continue-on-error: true
        env:
          HUSHPEN_TEST_MODEL: ${{ github.workspace }}/models/ggml-tiny.en.bin
          HUSHPEN_TEST_GPU: "1"
        run: cargo test --release -p hushpen-engine --features heavy --test it --locked transcribes_short_clip_on_gpu -- --nocapture
      - name: Cache the LLM smoke model
        if: inputs.suite == 'engine' || inputs.suite == 'full'
        id: llm-cache
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-0.8B-Q4_K_M.gguf
          key: Qwen3.5-0.8B-Q4_K_M-bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517
      - name: Download the LLM smoke model
        if: (inputs.suite == 'engine' || inputs.suite == 'full') && steps.llm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL --retry 3 -o models/Qwen3.5-0.8B-Q4_K_M.gguf \
            https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf
      # Qwen3.5 0.8B is too small to clean text, so the smoke checks the plumbing: the worker
      # loads the model, answers, and reuses the cached system prompt on the second job.
      - name: LLM smoke (CPU, 2 threads)
        if: inputs.suite == 'engine' || inputs.suite == 'full'
        run: |
          echo "bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517  models/Qwen3.5-0.8B-Q4_K_M.gguf" | shasum -a 256 -c -
          ./target/release/hushpen-llm --smoke models/Qwen3.5-0.8B-Q4_K_M.gguf --threads 2 --plumbing
      - name: LLM smoke (Metal, best effort)
        if: (inputs.suite == 'engine' || inputs.suite == 'full') && matrix.target == 'macos-arm64'
        continue-on-error: true
        run: ./target/release/hushpen-llm --smoke models/Qwen3.5-0.8B-Q4_K_M.gguf --gpu --plumbing

  # The installers for each target, named as in the mission's release notes, checked one by one
  # by `xtask package-verify`. On macos-15 CI=true lets cargo-packager build the dmg; the dmg
  # layout step drives Finder and never runs anywhere else.
  package:
    if: inputs.suite == 'package' || inputs.suite == 'package-smoke'
    needs: plan
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
      - name: Install the GPUI build libraries and the packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libxi-dev libxrandr-dev libasound2-dev libvulkan-dev libdbus-1-dev \
            rpm cpio squashfs-tools file desktop-file-utils binutils
      - name: Cache the packager binaries
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-generate-rpm
          key: packaging-tools-${{ runner.os }}-${{ runner.arch }}-packager-0.11.8-rpm-0.21.0
      - name: Install cargo-packager and cargo-generate-rpm
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-packager@0.11.8
          if [ "$RUNNER_OS" = Linux ]; then cargo install --locked cargo-generate-rpm@0.21.0; fi
      - name: Package
        run: cargo xtask package --target ${{ matrix.target }}
      - name: Verify every artifact
        run: |
          cargo xtask package-verify --target ${{ matrix.target }}
          ls -l target/dist/${{ matrix.target }}
          cat target/dist/${{ matrix.target }}/SHA256SUMS
      - name: Keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            target/dist/${{ matrix.target }}/Hushpen-*
            target/dist/${{ matrix.target }}/SHA256SUMS
          if-no-files-found: error

  # Linux: the deb and rpm in stock distro containers, and the AppImage under xvfb-run.
  # macOS: the zip, and the dmg mounted on the runner.
  smoke:
    if: inputs.suite == 'package-smoke'
    needs: [plan, package]
    name: package smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ github.workspace }}/dist
      - name: deb in debian:12
        if: matrix.target != 'macos-arm64'
        run: packaging/smoke/install-in-container.sh "$GITHUB_WORKSPACE/dist" debian:12
      - name: deb in ubuntu:22.04
        if: matrix.target != 'macos-arm64'
        run: packaging/smoke/install-in-container.sh "$GITHUB_WORKSPACE/dist" ubuntu:22.04
      - name: rpm in fedora:40
        if: matrix.target != 'macos-arm64'
        run: packaging/smoke/install-in-container.sh "$GITHUB_WORKSPACE/dist" fedora:40
      - name: AppImage under xvfb-run
        if: matrix.target != 'macos-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils mesa-vulkan-drivers \
            imagemagick dbus libvulkan1 libxkbcommon0 libxkbcommon-x11-0 libasound2 \
            libfontconfig1 libwayland-client0 libwayland-egl1 libdbus-1-3
          packaging/smoke/appimage-xvfb.sh "$(ls dist/Hushpen-*.AppImage)" "$RUNNER_TEMP/appimage-${{ matrix.target }}.png"
      - name: Keep the AppImage screenshot
        if: matrix.target != 'macos-arm64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.target }}
          path: ${{ runner.temp }}/appimage-${{ matrix.target }}.png
          if-no-files-found: ignore
      - name: zip and dmg
        if: matrix.target == 'macos-arm64'
        run: packaging/smoke/mac.sh "$GITHUB_WORKSPACE/dist"

  # The core harness subset on the x64 runner: the same container, suites, and checks as the Mac
  # harness, with the models and the speech clip fetched here. Runs only for linux-x64.
  e2e-x64:
    if: (inputs.suite == 'e2e' || inputs.suite == 'full') && contains(format(',{0},', inputs.targets), ',linux-x64,')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      HUSHPEN_PLATFORM: linux/amd64
      HUSHPEN_ROOT: /home/runner/work/_temp/hushpen
      HUSHPEN_TEST_ASSETS: /home/runner/work/_temp/assets
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the debug build and the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Fetch the base model and the speech clip
        run: |
          mkdir -p "$HUSHPEN_TEST_ASSETS/models/whisper" "$HUSHPEN_TEST_ASSETS/fixtures"
          curl -fsSL --retry 3 -o "$HUSHPEN_TEST_ASSETS/models/whisper/ggml-base.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          echo "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe  $HUSHPEN_TEST_ASSETS/models/whisper/ggml-base.bin" | sha256sum -c -
          cp crates/hushpen-engine/tests/fixtures/speech-short.wav "$HUSHPEN_TEST_ASSETS/fixtures/"
          echo "8fc4dec907177d271433fbe06ec67f457f2735bc986dbed8325d57280c4f6131  $HUSHPEN_TEST_ASSETS/fixtures/speech-short.wav" | sha256sum -c -
      # The insertion suite kills the engine during a long clip and feeds it silence; neither needs real words.
      - name: Make the long clip and the silent clip
        run: |
          python3 - <<'PY'
          import os, wave
          fixtures = os.path.join(os.environ["HUSHPEN_TEST_ASSETS"], "fixtures")
          with wave.open(os.path.join(fixtures, "speech-short.wav"), "rb") as src:
              params, frames = src.getparams(), src.readframes(src.getnframes())
          with wave.open(os.path.join(fixtures, "dictation-45s.wav"), "wb") as out:
              out.setparams(params)
              out.writeframes(frames * 10)
          with wave.open(os.path.join(fixtures, "silence-5s.wav"), "wb") as out:
              out.setparams(params)
              out.writeframes(b"\0\0" * params.framerate * 5)
          PY
      - name: Build the harness image
        run: docker build --platform linux/amd64 -t hushpen-val:noble -f harness/Dockerfile harness
      - name: Insertion suite
        # Root, because the container writes the slot folders as root and the scripts then clean them.
        run: sudo -E harness/run-suite.sh insert --slots 1 --build
      - name: Guards suite
        run: sudo -E harness/run-suite.sh guards --slots 1
      - name: Keep the suite output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-x64
          path: ${{ runner.temp }}/hushpen/slots/1/out
          if-no-files-found: ignore

  # The self-update check from a test feed, on the x64 runner: two release builds with the
  # update-test-feed feature (rc.1 and rc.2), a signed local feed made with a fresh test key, the
  # AppImage updating itself in the harness container, and the deb and rpm showing the notice only.
  updater-x64:
    if: inputs.suite == 'updater' && contains(format(',{0},', inputs.targets), ',linux-x64,')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      HUSHPEN_PLATFORM: linux/amd64
      HUSHPEN_ROOT: /home/runner/work/_temp/hushpen
      HUSHPEN_TEST_ASSETS: /home/runner/work/_temp/assets
      HUSHPEN_UPDATE_TEST: /home/runner/work/_temp/update-test
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the builds and the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: updater-x64
      - name: Install the GPUI build libraries and the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libxi-dev libxrandr-dev libasound2-dev libvulkan-dev libdbus-1-dev \
            rpm cpio squashfs-tools file desktop-file-utils binutils
      - name: Cache the packager binaries
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-generate-rpm
          key: packaging-tools-${{ runner.os }}-${{ runner.arch }}-packager-0.11.8-rpm-0.21.0
      - name: Install cargo-packager and cargo-generate-rpm
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-packager@0.11.8
          cargo install --locked cargo-generate-rpm@0.21.0
      - name: Build rc.1 (all installers) and rc.2 (AppImage) with the test feed
        run: |
          HUSHPEN_BUILD_VERSION=2.0.0-rc.1 cargo xtask package --target linux-x64 --test-feed \
            --formats appimage,deb,rpm,tar.gz --out "$RUNNER_TEMP/rc1"
          HUSHPEN_BUILD_VERSION=2.0.0-rc.2 cargo xtask package --target linux-x64 --test-feed \
            --formats appimage --out "$RUNNER_TEMP/rc2"
          ls -l "$RUNNER_TEMP/rc1" "$RUNNER_TEMP/rc2"
      - name: Sign the feeds with a fresh test key
        run: harness/update-fixtures.sh "$RUNNER_TEMP/rc1" "$RUNNER_TEMP/rc2" "$HUSHPEN_UPDATE_TEST"
      - name: Fetch the tiny.en model and the speech clip
        run: |
          mkdir -p "$HUSHPEN_TEST_ASSETS/models/whisper" "$HUSHPEN_TEST_ASSETS/fixtures"
          curl -fsSL --retry 3 -o "$HUSHPEN_TEST_ASSETS/models/whisper/ggml-tiny.en.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          echo "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  $HUSHPEN_TEST_ASSETS/models/whisper/ggml-tiny.en.bin" | sha256sum -c -
          cp crates/hushpen-engine/tests/fixtures/speech-short.wav "$HUSHPEN_TEST_ASSETS/fixtures/"
      - name: Build the harness image
        run: docker build --platform linux/amd64 -t hushpen-val:noble -f harness/Dockerfile harness
      - name: AppImage updates itself (self-update suite)
        # Root, because the container writes the slot folders as root and the scripts then clean them.
        run: sudo -E harness/run-suite.sh self-update --slots 1 --build
      - name: deb in ubuntu:24.04 shows the notice only
        timeout-minutes: 15
        run: packaging/smoke/update-notice-in-container.sh "$HUSHPEN_UPDATE_TEST" ubuntu:24.04 "$RUNNER_TEMP/notice"
      - name: rpm in fedora:40 shows the notice only
        timeout-minutes: 15
        run: packaging/smoke/update-notice-in-container.sh "$HUSHPEN_UPDATE_TEST" fedora:40 "$RUNNER_TEMP/notice"
      - name: Keep the suite output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-x64
          path: |
            ${{ runner.temp }}/hushpen/slots/1/out
            ${{ runner.temp }}/notice
          if-no-files-found: ignore

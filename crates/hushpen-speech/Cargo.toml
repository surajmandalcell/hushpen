[package]
name = "hushpen-speech"
description = "Hushpen text to speech: text preparation, speech engines, and the system voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hushpen-audio.workspace = true
hushpen-core.workspace = true
markdown.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-avf-audio = { workspace = true, features = [
    "std", "block2", "AVSpeechSynthesis", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes",
] }
objc2-foundation.workspace = true

[dev-dependencies]
tempfile.workspace = true

# macOS delivers system voice audio on the main queue, which the default test harness does not
# run.
[[test]]
name = "system_voice"
harness = false

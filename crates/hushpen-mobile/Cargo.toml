[package]
name = "hushpen-mobile"
description = "Shared Hushpen phone API and native bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
bindgen = ["uniffi/cli"]

[dependencies]
hushpen-core.workspace = true
hushpen-engine.workspace = true
hushpen-host.workspace = true
hushpen-llm = { path = "../hushpen-llm" }
hushpen-remote.workspace = true
hushpen-store = { workspace = true, features = ["downloads"] }
log.workspace = true
serde_json.workspace = true
uniffi.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

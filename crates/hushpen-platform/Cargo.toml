[package]
name = "hushpen-platform"
description = "Hushpen platform layer: macOS and Linux keys, insertion, permissions, window chrome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Debug test builds only, through hushpen-app's test-automation feature.
test-automation = []

[dependencies]
hushpen-core.workspace = true
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
core-foundation.workspace = true
# `elcapitan` adds CGEventPostToPid, for keys sent to one app's process.
core-graphics = { workspace = true, features = ["elcapitan"] }
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-service-management.workspace = true
[dev-dependencies]
tempfile.workspace = true

# AppKit views need the main thread, which the default test harness does not give.
[[test]]
name = "sidebar_material"
harness = false

[[test]]
name = "window_chrome"
harness = false

[package]
name = "hushpen-platform"
description = "Hushpen platform layer: macOS and Linux keys, insertion, permissions, window chrome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Debug test builds only, through hushpen-app's test-automation feature.
test-automation = []

[dependencies]
hushpen-core.workspace = true
log.workspace = true
# The X11 key names, for a key Hushpen has no name of its own for.
xkeysym.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation",
    "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Accessibility",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
core-foundation.workspace = true
# `elcapitan` adds CGEventPostToPid, for keys sent to one app's process.
core-graphics = { workspace = true, features = ["elcapitan"] }
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-service-management.workspace = true
[dev-dependencies]
tempfile.workspace = true

# AppKit views need the main thread, which the default test harness does not give.
[[test]]
name = "sidebar_material"
harness = false

[[test]]
name = "window_chrome"
harness = false

[package]
name = "hushpen-app"
description = "Hushpen desktop app (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "hushpen"
path = "src/main.rs"

[features]
# Debug builds only; release-check proves it is absent from shipped binaries.
test-automation = [
    "dep:hushpen-testhook",
    "hushpen-testhook/guard",
    "hushpen-platform/test-automation",
    "gpui-kit/test-support",
]
# Offscreen pixel baselines (tests/pixel.rs). Linux containers only: the
# renderer needs Vulkan (lavapipe). The extra crates are optional so a normal
# build and test run never compile them.
pixel-tests = [
    "dep:gpui-pre-wgpu",
    "dep:image",
    "gpui-kit/test-support",
]

# Lets HUSHPEN_UPDATE_FEED and HUSHPEN_UPDATE_PUBKEY replace the feed and the key. Test builds
# only; `xtask release-check` proves it is absent from shipped binaries.
update-test-feed = []

[dependencies]
hushpen-audio.workspace = true
hushpen-core.workspace = true
hushpen-engine.workspace = true
hushpen-platform.workspace = true
hushpen-store.workspace = true
hushpen-testhook = { workspace = true, optional = true }
futures.workspace = true
gpui-kit.workspace = true
gpui-tray.workspace = true
gpui-pre-wgpu = { workspace = true, features = ["test-support"], optional = true }
image = { workspace = true, optional = true }
log.workspace = true
minisign-verify.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rfd.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# `cargo xtask package` replaces these keys through `--metadata-overwrite`: the
# assets, the dependency lines, and the version come from one place there.
[package.metadata.generate-rpm]
name = "hushpen"
license = "AGPL-3.0-or-later"
assets = []

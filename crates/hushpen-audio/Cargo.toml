[package]
name = "hushpen-audio"
description = "Hushpen audio: capture, session WAV, resampling, decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hushpen-core.workspace = true
cpal.workspace = true
hound.workspace = true
log.workspace = true
serde_json.workspace = true
nnnoiseless.workspace = true
rubato.workspace = true
symphonia.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }

[dev-dependencies]
tempfile.workspace = true

[package]
name = "hushpen-engine"
description = "Hushpen speech engine child and child process supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Integration tests with a real model (tests/it.rs). Off by default.
heavy = []

[dependencies]
hushpen-audio.workspace = true
hushpen-core.workspace = true
hushpen-store.workspace = true
hound.workspace = true
serde_json.workspace = true
whisper-rs.workspace = true
whisper-rs-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, features = ["metal"] }

[dev-dependencies]
tempfile.workspace = true

# A scripted stand-in for hushpen-llm that the supervisor tests start as the child.
[[bin]]
name = "fake-llm"
path = "tests/support/fake_llm.rs"
test = false

# A scripted stand-in for hushpen-tts, likewise.
[[bin]]
name = "fake-tts"
path = "tests/support/fake_tts.rs"
test = false

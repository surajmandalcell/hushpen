[package]
name = "hushpen-store"
description = "Hushpen storage: data folder, settings, SQLite history, logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
downloads = ["dep:ureq"]
update-test-feed = ["downloads"]
test-support = ["downloads"]

[dependencies]
hushpen-core.workspace = true
directories.workspace = true
log = { workspace = true, features = ["std"] }
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security",
    "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory",
    "Win32_UI_Shell", "Win32_System_Com",
] }

[dev-dependencies]
tempfile.workspace = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Hushpen logo">
  <defs>
    <linearGradient id="g-carbon" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="g-rim" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="g-symbol-v3" x1="0" y1="300" x2="1024" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="f-shadow-dense" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="f-inset-symbol" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g transform="translate(80 80) scale(0.84375)">
    <!-- Carbon plate -->
    <rect width="1024" height="1024" rx="224" fill="url(#g-carbon)"/>
    
    <!-- Chamfer borders -->
    <rect x="1" y="1" width="1022" height="1022" rx="223" fill="none" stroke="url(#g-rim)" stroke-width="2"/>
    <rect x="3" y="3" width="1018" height="1018" rx="221" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Wave Symbol -->
    <g transform="translate(205 205) scale(0.6)" filter="url(#f-inset-symbol)">
      <path d="M 188 512 C 188 356 356 342 512 512 C 668 682 836 668 836 512 C 836 356 668 342 512 512 C 356 682 188 668 188 512" 
            fill="none" stroke="url(#g-symbol-v3)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
